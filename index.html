<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계 일주 비행기 레이스</title>
<style>
  :root {
    --navy:#17345b; --blue:#2477d4; --sky:#eaf6ff; --gold:#ffd45c;
    --green:#32a879; --red:#d94b55; --ink:#18304b; --muted:#62758a;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;
    color:var(--ink); background:linear-gradient(180deg,#dff3ff 0%,#f8fbff 48%,#eef5ff 100%);
    min-height:100vh;
  }
  .wrap { width:min(1100px,100%); margin:0 auto; padding:18px; }
  header { text-align:center; padding:10px 8px 18px; }
  h1 { margin:0; font-size:clamp(1.65rem,4vw,2.6rem); color:var(--navy); }
  .subtitle { margin:8px 0 0; font-size:clamp(1rem,2vw,1.15rem); color:#46627e; }
  .panel {
    background:#fff; border:2px solid #d6e8f7; border-radius:22px;
    box-shadow:0 8px 22px #23486b12; padding:18px; margin-bottom:16px;
  }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .track-title { font-weight:900; font-size:1.2rem; }
  .status { background:#eef6ff; border-radius:999px; padding:8px 13px; font-weight:800; }
  .track-list { display:grid; gap:14px; margin-top:15px; }
  .lane { display:grid; grid-template-columns:94px 1fr; gap:10px; align-items:center; }
  .pilot { font-weight:900; font-size:1rem; }
  .pilot small { display:block; color:var(--muted); font-weight:600; font-size:.78rem; }
  .rail {
    height:56px; position:relative; border-radius:15px; overflow:hidden;
    border:2px solid #c5d9e9;
    background:repeating-linear-gradient(90deg,#f4f8fc 0 9%,#e5eff7 9% 10%);
  }
  .rail:before { content:""; position:absolute; top:50%; left:0; right:0; border-top:2px dashed #b8cbdc; }
  .plane {
    position:absolute; top:50%; left:0%; transform:translate(-50%,-55%);
    font-size:2rem; z-index:2; transition:left .7s cubic-bezier(.2,.8,.2,1);
    filter:drop-shadow(0 3px 2px #0002);
  }
  .finish {
    position:absolute; right:4px; top:0; bottom:0; width:4px;
    background:repeating-linear-gradient(180deg,#26384c 0 6px,#fff 6px 12px); z-index:1;
  }
  .finish-label { position:absolute; right:8px; top:2px; font-size:.65rem; font-weight:900; color:#53687c; }
  .track-foot { display:flex; justify-content:space-between; margin:7px 0 0 104px; color:var(--muted); font-size:.78rem; }
  .race-info { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .chip { background:#f0f6fc; padding:8px 12px; border-radius:12px; font-weight:750; }
  .question-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .q-number { font-weight:900; color:var(--blue); font-size:1.05rem; }
  .q-text { font-size:clamp(1.15rem,2.6vw,1.5rem); line-height:1.5; font-weight:850; margin:14px 0 18px; }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .answer {
    text-align:left; border:2px solid #c9dceb; border-radius:15px; padding:14px;
    background:#f9fcff; color:var(--ink); font-size:1.05rem; font-weight:750;
    cursor:pointer; min-height:64px; transition:.15s;
  }
  .answer:hover:not(:disabled) { border-color:var(--blue); background:#edf6ff; transform:translateY(-1px); }
  .answer:disabled { cursor:default; opacity:1; }
  .answer.correct { border-color:var(--green); background:#e8f8f1; }
  .answer.wrong { border-color:var(--red); background:#fff0f0; }
  .feedback { display:none; margin-top:15px; border-radius:15px; padding:14px 16px; line-height:1.55; font-weight:700; }
  .feedback.show { display:block; }
  .feedback.good { background:#e8f8f1; color:#176747; }
  .feedback.bad { background:#fff0f0; color:#9d3038; }
  .actions { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  button.primary {
    border:0; border-radius:14px; padding:13px 22px; font-size:1.05rem; font-weight:900;
    color:white; background:var(--blue); cursor:pointer; box-shadow:0 4px 0 #14569f;
  }
  button.primary:disabled { background:#9db3c8; box-shadow:none; cursor:not-allowed; }
  .booster { display:flex; align-items:center; gap:8px; font-weight:850; }
  .pips { display:flex; gap:5px; }
  .pip { width:17px; height:17px; border-radius:50%; background:#d8e3ec; border:2px solid #b9c9d7; }
  .pip.on { background:var(--gold); border-color:#e3a900; box-shadow:0 0 8px #ffd45c99; }
  .notice { color:var(--muted); font-size:.9rem; }
  .continent-pop {
    position:fixed; left:50%; top:22%; transform:translate(-50%,-15px) scale(.8);
    background:#17345bee; color:white; border:2px solid #fff; border-radius:20px;
    padding:16px 24px; font-size:clamp(1.15rem,4vw,1.8rem); font-weight:950;
    box-shadow:0 12px 35px #102c4b55; opacity:0; pointer-events:none; z-index:10;
  }
  .continent-pop.show { animation:pop 1.7s ease forwards; }
  @keyframes pop { 0%{opacity:0;transform:translate(-50%,-15px) scale(.8)} 15%,75%{opacity:1;transform:translate(-50%,0) scale(1)} 100%{opacity:0;transform:translate(-50%,-10px) scale(.95)} }
  .sparkle { animation:sparkle .75s ease-out; }
  @keyframes sparkle { 0%{filter:drop-shadow(0 0 0 #ffd45c)} 35%{filter:drop-shadow(0 0 13px #ffd45c) drop-shadow(0 0 22px #fff)} 100%{filter:drop-shadow(0 3px 2px #0002)} }
  .result { display:none; }
  .result.show { display:block; }
  .result h2 { margin-top:0; font-size:1.6rem; }
  .podium { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:15px 0; }
  .pod { background:#f0f6fc; border-radius:14px; padding:12px; text-align:center; font-weight:850; }
  .pod strong { display:block; font-size:1.7rem; }
  .review { border-top:1px solid #dce7f0; padding:12px 0; line-height:1.5; }
  .review b { display:block; margin-bottom:4px; }
  .hidden { display:none !important; }
  @media(max-width:620px) {
    .wrap{padding:10px}.panel{padding:13px;border-radius:17px}
    .lane{grid-template-columns:74px 1fr;gap:7px}.pilot{font-size:.9rem}
    .rail{height:49px}.plane{font-size:1.7rem}.track-foot{margin-left:81px}
    .answers{grid-template-columns:1fr}.answer{min-height:55px;padding:12px}
    .podium{grid-template-columns:1fr 1fr 1fr}.pod{padding:9px 4px;font-size:.85rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✈️ 세계 일주 비행기 레이스</h1>
    <p class="subtitle">문제를 풀고 대륙을 지나 인천공항 결승선으로 돌아오세요!</p>
  </header>

  <section class="panel" aria-label="레이스 트랙">
    <div class="topline">
      <div class="track-title">🌍 지구 한 바퀴 레이스</div>
      <div class="status" id="rankStatus">현재 순위 계산 중</div>
    </div>
    <div class="track-list">
      <div class="lane"><div class="pilot">나의 비행기<small>학생</small></div><div class="rail"><span class="plane" id="plane0">🛩️</span><span class="finish"></span><span class="finish-label">인천 ✈</span></div></div>
      <div class="lane"><div class="pilot">구름호<small>컴퓨터 1</small></div><div class="rail"><span class="plane" id="plane1">☁️</span><span class="finish"></span><span class="finish-label">인천 ✈</span></div></div>
      <div class="lane"><div class="pilot">무지개호<small>컴퓨터 2</small></div><div class="rail"><span class="plane" id="plane2">🌈</span><span class="finish"></span><span class="finish-label">인천 ✈</span></div></div>
    </div>
    <div class="track-foot"><span>출발: 인천공항</span><span>결승선: 인천공항 🏁</span></div>
    <div class="race-info">
      <span class="chip" id="progress">문제 1 / 10</span>
      <span class="chip" id="score">정답 0개</span>
      <span class="chip">부스터: 정답 2연속이면 자동 발동</span>
    </div>
  </section>

  <section class="panel" id="quizPanel">
    <div class="question-head">
      <span class="q-number" id="qNumber">QUESTION 01</span>
      <div class="booster">⚡ 부스터 충전 <span class="pips" id="pips"><i class="pip"></i><i class="pip"></i></span></div>
    </div>
    <div class="q-text" id="question">문제가 여기에 표시됩니다.</div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="actions">
      <span class="notice" id="hint">문제를 읽는 동안 비행기는 잠시 대기합니다.</span>
      <button class="primary" id="nextBtn" disabled>다음 문제 →</button>
    </div>
  </section>

  <section class="panel result" id="resultPanel">
    <h2 id="resultTitle">🏁 레이스 결과</h2>
    <div class="podium" id="podium"></div>
    <p id="resultSummary"></p>
    <h3>📘 틀린 문제 다시 보기</h3>
    <div id="reviewList"></div>
    <div class="actions"><span class="notice">다시 시작하면 문제와 보기 순서가 새롭게 섞입니다.</span><button class="primary" id="restartBtn">↻ 다시 하기</button></div>
  </section>
</div>
<div class="continent-pop" id="continentPop"></div>

<script>
// ============================================================
// 교사용 문제 편집 영역: 문항 10개를 이 목록에서 수정하세요.
// answer는 choices 안의 정답 문장과 정확히 같아야 합니다.
// ============================================================
const QUESTION_BANK = [
  {
    q:"지구상의 위치를 나타낼 때, 적도를 기준으로 남쪽과 북쪽으로 얼마나 떨어져 있는지를 나타내는 것은?",
    choices:["경도","위도","표준시","날짜 변경선"], answer:"위도",
    explain:"위도는 적도를 기준으로 남북의 위치를 나타내며, 적도는 위도 0°입니다."
  },
  {
    q:"본초 자오선을 기준으로 동쪽과 서쪽으로 얼마나 떨어져 있는지를 나타내는 것은?",
    choices:["위도","고도","경도","기온"], answer:"경도",
    explain:"경도는 본초 자오선을 기준으로 동서의 위치를 나타냅니다."
  },
  {
    q:"일반적으로 적도에 가까운 저위도 지역이 고위도 지역보다 기온이 높은 까닭은?",
    choices:["태양 에너지를 더 수직에 가깝게 받기 때문에","바다와 더 멀리 떨어져 있기 때문에","밤이 항상 더 짧기 때문에","고도가 더 높기 때문에"], answer:"태양 에너지를 더 수직에 가깝게 받기 때문에",
    explain:"저위도는 태양 고도가 높아 단위 면적이 받는 태양 에너지가 많아 대체로 기온이 높습니다."
  },
  {
    q:"연중 기온이 높고 강수량이 많아 열대 우림이 발달하는 기후는?",
    choices:["한대 기후","건조 기후","열대 기후","냉대 기후"], answer:"열대 기후",
    explain:"열대 기후는 연중 기온이 높으며, 열대 우림 기후 지역은 비가 많이 내립니다."
  },
  {
    q:"강수량이 매우 적어 사막이나 스텝이 나타나고, 물을 구하기 어려운 기후는?",
    choices:["온대 기후","건조 기후","열대 기후","한대 기후"], answer:"건조 기후",
    explain:"건조 기후는 증발량에 비해 강수량이 적어 사막과 초원이 나타납니다."
  },
  {
    q:"사계절의 변화가 비교적 뚜렷하고, 벼농사와 다양한 밭농사가 이루어지는 기후는?",
    choices:["온대 기후","한대 기후","건조 기후","열대 기후"], answer:"온대 기후",
    explain:"온대 기후는 대체로 온화하고 계절 변화가 있어 다양한 농업과 생활이 발달합니다."
  },
  {
    q:"겨울이 춥고 길며 여름은 비교적 짧고 온화한 지역에 넓게 나타나는 기후는?",
    choices:["열대 기후","냉대 기후","온대 기후","건조 기후"], answer:"냉대 기후",
    explain:"냉대 기후는 겨울이 춥고 길며 침엽수림이 넓게 분포하는 지역이 많습니다."
  },
  {
    q:"일 년 내내 기온이 매우 낮고, 툰드라나 빙설 경관이 나타나는 기후는?",
    choices:["온대 기후","열대 기후","한대 기후","냉대 기후"], answer:"한대 기후",
    explain:"한대 기후는 기온이 매우 낮아 나무가 자라기 어렵고 툰드라·빙설 경관이 나타납니다."
  },
  {
    q:"비가 적은 건조 기후 지역에서 햇빛과 모래바람을 막기 위해 입는 옷으로 알맞은 것은?",
    choices:["얇고 노출이 많은 옷만 입는다","몸을 감싸는 헐렁한 긴 옷을 입는다","두꺼운 털옷만 입는다","비옷과 장화를 항상 입는다"], answer:"몸을 감싸는 헐렁한 긴 옷을 입는다",
    explain:"건조 지역에서는 헐렁하고 긴 옷으로 강한 햇빛과 모래바람을 막고 몸을 보호합니다."
  },
  {
    q:"강수량이 적은 건조 기후 지역의 전통적인 집과 음식 생활로 알맞은 것은?",
    choices:["눈과 얼음으로 집을 짓고 생선을 주로 먹는다","지붕을 급경사로 만들어 눈을 흘려보내고 감자를 먹는다","두꺼운 벽이나 작은 창으로 햇빛과 열기를 막고, 오아시스의 대추야자 등을 이용한다","바닥을 높인 고상 가옥에서 쌀농사만 한다"], answer:"두꺼운 벽이나 작은 창으로 햇빛과 열기를 막고, 오아시스의 대추야자 등을 이용한다",
    explain:"건조 지역의 집은 강한 햇빛과 더위를 막도록 짓고, 오아시스에서는 대추야자 등 관개 농업이 이루어집니다."
  }
];

const CONTINENTS = ["아시아","유럽","아프리카","북아메리카","남아메리카","오세아니아","남극 대륙","아시아"];
let questions = [], index = 0, score = 0, positions = [0,0,0], streak = 0, missed = [], answered = false;

const $ = id => document.getElementById(id);
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function prepareQuestions() {
  questions = shuffle(QUESTION_BANK).map(item => ({...item, choices:shuffle(item.choices)}));
}
function updateTrack() {
  positions.forEach((p,i) => { $( "plane"+i ).style.left = Math.min(98,Math.max(2,p))+"%"; });
  const order = positions.map((p,i)=>({p,i})).sort((a,b)=>b.p-a.p);
  const names = ["나","구름호","무지개호"];
  $("rankStatus").textContent = "현재 "+(order.findIndex(x=>x.i===0)+1)+"위 · 선두 "+names[order[0].i];
  $("score").textContent = "정답 "+score+"개";
}
function updatePips() {
  $("pips").innerHTML = `<i class="pip ${streak>=1?'on':''}"></i><i class="pip ${streak>=2?'on':''}"></i>`;
}
function showQuestion() {
  answered=false;
  $("progress").textContent = `문제 ${index+1} / 10`;
  $("qNumber").textContent = `QUESTION ${String(index+1).padStart(2,"0")}`;
  $("question").textContent = questions[index].q;
  $("answers").innerHTML = "";
  questions[index].choices.forEach((choice,i)=>{
    const b=document.createElement("button"); b.className="answer"; b.textContent=`${i+1}. ${choice}`;
    b.addEventListener("click",()=>chooseAnswer(choice,b)); $("answers").appendChild(b);
  });
  $("feedback").className="feedback"; $("feedback").textContent="";
  $("nextBtn").disabled=true; $("nextBtn").textContent=index===9?"결과 보기 🏁":"다음 문제 →";
  $("hint").textContent="문제를 읽는 동안 모든 비행기는 잠시 대기합니다.";
  updatePips();
}
function flashContinent() {
  const c=CONTINENTS[(score-1)%CONTINENTS.length];
  const pop=$("continentPop"); pop.textContent=`🌏 ${c} 대륙 통과!`;
  pop.classList.remove("show"); void pop.offsetWidth; pop.classList.add("show");
}
function chooseAnswer(choice, button) {
  if(answered) return;
  answered=true;
  const item=questions[index], correct=choice===item.answer;
  [...$("answers").children].forEach(b=>{
    b.disabled=true;
    if(b.textContent.slice(3)===item.answer) b.classList.add("correct");
  });
  if(correct) {
    score++; streak++;
    positions[0]=Math.min(100,positions[0]+12);
    let boosterText="";
    if(streak===2) { positions[0]=Math.min(100,positions[0]+10); streak=0; boosterText=" ⚡ 2연속 정답! 부스터 발동 (+10)"; }
    $("feedback").className="feedback show good";
    $("feedback").innerHTML=`<strong>정답! ✨</strong> 내 비행기가 크게 전진했습니다.${boosterText}<br>${item.explain}`;
    $("plane0").classList.remove("sparkle"); void $("plane0").offsetWidth; $("plane0").classList.add("sparkle");
    flashContinent();
  } else {
    streak=0; button.classList.add("wrong");
    missed.push({item, chosen:choice});
    $("feedback").className="feedback show bad";
    $("feedback").innerHTML=`<strong>아쉬워요! 정답은 '${item.answer}'입니다.</strong><br>${item.explain}`;
  }
  // 컴퓨터는 학생이 답을 선택했을 때에만 조금씩 이동한다.
  const computerSteps=[[7,8,7,8,7,8,7,8,7,8],[8,7,8,7,8,7,8,7,8,7]];
  positions[1]+=computerSteps[0][index];
  positions[2]+=computerSteps[1][index];
  updateTrack(); updatePips();
  $("nextBtn").disabled=false;
  $("hint").textContent=correct?"좋아요! 해설을 읽고 다음 문제로 가세요.":"오답도 좋은 복습 기회예요. 해설을 확인하세요.";
}
function finishGame() {
  $("quizPanel").classList.add("hidden"); $("resultPanel").classList.add("show");
  const names=["나의 비행기","구름호","무지개호"];
  const order=positions.map((p,i)=>({p,i})).sort((a,b)=>b.p-a.p);
  $("resultTitle").textContent=order[0].i===0?"🏆 우승! 인천공항에 가장 먼저 도착했어요!":"🏁 레이스 종료!";
  $("podium").innerHTML=order.map((o,rank)=>`<div class="pod"><strong>${["🥇","🥈","🥉"][rank]}</strong>${rank+1}위<br>${names[o.i]}<br><small>${Math.round(o.p)}% 진행</small></div>`).join("");
  $("resultSummary").textContent=`10문제 중 ${score}개 정답, ${10-score}개 오답입니다. ${score>=7?"7개 이상 맞혔어요! 개념을 잘 이해하고 있네요.":"틀린 문제의 해설을 다시 읽고 한 번 더 도전해 보세요."}`;
  $("reviewList").innerHTML=missed.length?missed.map((m,i)=>`<div class="review"><b>${i+1}. ${m.item.q}</b>내가 고른 답: ${m.chosen}<br>정답: <strong>${m.item.answer}</strong><br>해설: ${m.item.explain}</div>`).join(""):"<p>틀린 문제가 없습니다! 완벽한 레이스예요. 🎉</p>";
}
$("nextBtn").addEventListener("click",()=>{
  if(!answered)return;
  if(index===9) finishGame(); else {index++;showQuestion();}
});
$("restartBtn").addEventListener("click",()=>{
  index=0;score=0;positions=[0,0,0];streak=0;missed=[];
  prepareQuestions(); $("resultPanel").classList.remove("show"); $("quizPanel").classList.remove("hidden");
  updateTrack();showQuestion();
});
prepareQuestions(); updateTrack(); showQuestion();
</script>
</body>
</html>
